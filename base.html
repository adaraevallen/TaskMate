<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}TaskMate{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header class="header">
        <a class="logo" href="{{ url_for('index') }}">TaskMate</a>
        <nav>
            <a href="{{ url_for('index') }}">Tugas Belajar</a>
            <a href="{{ url_for('kalender') }}">Kalender Akademik</a>
            <a href="{{ url_for('fokus') }}">Timer Belajar</a>
        </nav>
    </header>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <footer>
        TaskMate — Temani proses belajarmu.
    </footer>
</body>
</html>
